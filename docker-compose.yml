services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartgate
      POSTGRES_PASSWORD: smartgate
      POSTGRES_DB: smartgate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartgate"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  smartgate:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://smartgate:smartgate@postgres:5432/smartgate
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://smartgate:smartgate@postgres:5432/smartgate
    depends_on:
      - smartgate

volumes:
  postgres_data:
  qdrant_data:
